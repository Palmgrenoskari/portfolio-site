<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="1.5 1.5 61 61">
  <defs>
    <!-- the centre item's clay-red glow (category "nopeus": #c26a5a) -->
    <radialGradient id="luGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b49c" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#c26a5a" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#c26a5a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- four bins in the cross layout (N/E/S/W) the item is sorted into -->
  <g fill="#faf7f2" stroke="#ccc2b1" stroke-width="1.5">
    <rect x="23.5" y="2.5" width="17" height="17" rx="4.5" />
    <rect x="44.5" y="23.5" width="17" height="17" rx="4.5" />
    <rect x="23.5" y="44.5" width="17" height="17" rx="4.5" />
    <rect x="2.5" y="23.5" width="17" height="17" rx="4.5" />
  </g>

  <!-- the matching group, highlighted: the coral bin the centre item belongs to -->
  <rect
    x="23.5"
    y="2.5"
    width="17"
    height="17"
    rx="4.5"
    fill="#e6845c"
    fill-opacity="0.16"
    stroke="#e6845c"
    stroke-width="2"
  />

  <!-- each bin holds its group's colour (coral / amber / green / teal) -->
  <circle cx="32" cy="11" r="3.4" fill="#e6845c" />
  <circle cx="53" cy="32" r="3.4" fill="#e6b45c" />
  <circle cx="32" cy="53" r="3.4" fill="#86c26e" />
  <circle cx="11" cy="32" r="3.4" fill="#6bb6cc" />

  <!-- the item being classified, glowing at the centre — coral, so it matches the N bin -->
  <circle cx="32" cy="32" r="14" fill="url(#luGlow)" />
  <rect
    x="23.5"
    y="23.5"
    width="17"
    height="17"
    rx="4.5"
    fill="#faf7f2"
    stroke="#ccc2b1"
    stroke-width="1.5"
  />
  <circle cx="32" cy="32" r="4.6" fill="#e6845c" />
  <circle cx="30.3" cy="30.3" r="1.3" fill="#ffffff" fill-opacity="0.85" />
</svg>
